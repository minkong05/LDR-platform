<!-- 📄 apps/dashboard/dashboard/templates/errors/403.html -->

{% extends "base.html" %}
{% block title %}Forbidden — LDR{% endblock %}

{% block content %}
<div class="card mt-4">
  <div class="card-body text-center py-5">
    <i class="bi bi-slash-circle display-4 text-danger mb-3 d-block"></i>
    <h5 class="text-muted">Forbidden</h5>
    <p class="text-muted small mb-3">
      Your account does not have permission to perform that action.
    </p>
    <a href="{{ url_for('alerts.list_alerts') }}" class="btn btn-sm btn-outline-warning">
      <i class="bi bi-arrow-left me-1"></i>Back to alerts
    </a>
  </div>
</div>
{% endblock %}
